<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Laporan Donat Agustus 2026</title>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #eef1f4;
      color: #1f2933;
    }

    .app {
      max-width: 1100px;
      margin: auto;
    }

    /* =========================
       LAPORAN
    ========================= */

    #laporan {
      width: 100%;
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }

    .header {
      text-align: center;
      padding-bottom: 20px;
      border-bottom: 2px solid #e5e7eb;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .header p {
      margin: 8px 0 0;
      color: #6b7280;
      font-size: 15px;
    }

    /* =========================
       RINGKASAN
    ========================= */

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 22px 0;
    }

    .summary-card {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px 10px;
      text-align: center;
      background: #fafafa;
    }

    .summary-card small {
      display: block;
      color: #6b7280;
      margin-bottom: 7px;
      font-size: 12px;
    }

    .summary-card strong {
      font-size: 25px;
    }

    /* =========================
       IKHWAN & AKHWAT
    ========================= */

    .laporan-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    .section {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
    }

    .section-title {
      padding: 14px;
      text-align: center;
      font-weight: bold;
      font-size: 17px;
      border-bottom: 1px solid #e5e7eb;
      background: #f8fafc;
      letter-spacing: .5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #f1f5f9;
      font-size: 12px;
      color: #4b5563;
      white-space: nowrap;
    }

    th,
    td {
      padding: 10px 7px;
      border-bottom: 1px solid #edf0f2;
      text-align: center;
      font-size: 13px;
    }

    th:first-child,
    td:first-child {
      text-align: left;
      padding-left: 14px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* =========================
       TOTAL
    ========================= */

    .final-box {
      margin-top: 22px;
      border: 2px solid #d1d5db;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      background: #fafafa;
    }

    .final-box small {
      color: #6b7280;
      font-weight: bold;
      letter-spacing: .5px;
    }

    .final-total {
      font-size: 40px;
      font-weight: bold;
      margin: 6px 0;
    }

    .final-box p {
      margin: 0;
      color: #6b7280;
      font-size: 12px;
    }

    /* =========================
       TOMBOL
    ========================= */

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      min-width: 190px;
    }

    .btn-image {
      background: #ffffff;
      border: 1px solid #d1d5db;
      color: #111827;
    }

    .btn-wa {
      background: #111827;
      color: white;
    }

    button:active {
      transform: scale(.98);
    }

    /* =========================
       RESPONSIVE TAMPILAN HP
    ========================= */

    @media (max-width: 700px) {

      body {
        padding: 10px;
      }

      #laporan {
        padding: 16px;
        border-radius: 14px;
      }

      .header h1 {
        font-size: 22px;
      }

      .summary {
        grid-template-columns: repeat(2, 1fr);
      }

      /* DI HP BOLEH BERTUMPUK */
      .laporan-grid {
        grid-template-columns: 1fr;
      }

      .final-total {
        font-size: 34px;
      }

      button {
        width: 100%;
      }

    }

    /* =========================
       MODE KHUSUS GAMBAR
       PAKSA LANDSCAPE
    ========================= */

    #laporan.capture-mode {
      width: 1200px !important;
      max-width: none !important;
      padding: 32px !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    #laporan.capture-mode .summary {
      grid-template-columns: repeat(4, 1fr) !important;
    }

    /* IKHWAN KIRI - AKHWAT KANAN */
    #laporan.capture-mode .laporan-grid {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: 16px !important;
    }

    #laporan.capture-mode .section {
      width: auto !important;
    }

    #laporan.capture-mode th,
    #laporan.capture-mode td {
      padding: 10px 7px !important;
      font-size: 13px !important;
    }

  </style>
</head>

<body>

<div class="app">

  <!-- =========================
       LAPORAN
  ========================== -->

  <div id="laporan">

    <div class="header">
      <h1>🍩 LAPORAN DONAT</h1>
      <p>Periode 10–21 Agustus 2026</p>
    </div>


    <!-- RINGKASAN -->

    <div class="summary">

      <div class="summary-card">
        <small>MASUK IKHWAN</small>
        <strong id="masukIkhwan">0</strong>
      </div>

      <div class="summary-card">
        <small>MASUK AKHWAT</small>
        <strong id="masukAkhwat">0</strong>
      </div>

      <div class="summary-card">
        <small>RETUR IKHWAN</small>
        <strong id="returIkhwan">0</strong>
      </div>

      <div class="summary-card">
        <small>TOTAL AKHIR</small>
        <strong id="totalAkhirAtas">0</strong>
      </div>

    </div>


    <!-- =========================
         IKHWAN DAN AKHWAT
    ========================== -->

    <div class="laporan-grid">


      <!-- IKHWAN KIRI -->

      <div class="section">

        <div class="section-title">
          IKHWAN
        </div>

        <table>

          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Masuk</th>
              <th>Retur</th>
              <th>Terjual</th>
            </tr>
          </thead>

          <tbody id="tableIkhwan"></tbody>

        </table>

      </div>


      <!-- AKHWAT KANAN -->

      <div class="section">

        <div class="section-title">
          AKHWAT
        </div>

        <table>

          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Masuk</th>
              <th>Sisa</th>
              <th>Keterangan</th>
            </tr>
          </thead>

          <tbody id="tableAkhwat"></tbody>

        </table>

      </div>

    </div>


    <!-- TOTAL -->

    <div class="final-box">

      <small>TOTAL DONAT KESELURUHAN</small>

      <div class="final-total">
        <span id="finalTotal">0</span> DONAT
      </div>

      <p>
        Total masuk dikurangi retur yang tercatat.
      </p>

    </div>

  </div>


  <!-- TOMBOL -->

  <div class="actions">

    <button
      class="btn-image"
      onclick="jadikanGambar()"
    >
      🖼️ Jadikan Gambar
    </button>

    <button
      class="btn-wa"
      onclick="kirimWhatsApp()"
    >
      📤 Kirim / Bagikan WhatsApp
    </button>

  </div>

</div>


<script>

  /* =========================
     DATA IKHWAN
  ========================= */

  const ikhwan = [

    { tanggal: "10/8", masuk: 40, retur: 0 },
    { tanggal: "11/8", masuk: 42, retur: 0 },
    { tanggal: "12/8", masuk: 41, retur: 0 },
    { tanggal: "13/8", masuk: 50, retur: 0 },
    { tanggal: "14/8", masuk: 50, retur: 0 },
    { tanggal: "15/8", masuk: 50, retur: 0 },
    { tanggal: "16/8", masuk: 50, retur: 0 },
    { tanggal: "17/8", masuk: 50, retur: 0 },
    { tanggal: "18/8", masuk: 55, retur: 0 },
    { tanggal: "19/8", masuk: 56, retur: 0 },
    { tanggal: "20/8", masuk: 57, retur: 0 },
    { tanggal: "21/8", masuk: 50, retur: 1 }

  ];


  /* =========================
     DATA AKHWAT
  ========================= */

  const akhwat = [

    { tanggal: "10/8", masuk: 32, sisa: "-", ket: "-" },
    { tanggal: "11/8", masuk: 35, sisa: 0, ket: "Habis" },
    { tanggal: "12/8", masuk: 35, sisa: "-", ket: "-" },
    { tanggal: "13/8", masuk: 42, sisa: 1, ket: "Sisa" },
    { tanggal: "14/8", masuk: 40, sisa: "-", ket: "-" },
    { tanggal: "15/8", masuk: 35, sisa: "-", ket: "-" },
    { tanggal: "16/8", masuk: 43, sisa: 1, ket: "Tidak retur" },
    { tanggal: "17/8", masuk: 37, sisa: "-", ket: "-" },
    { tanggal: "18/8", masuk: 40, sisa: "-", ket: "-" },
    { tanggal: "19/8", masuk: 40, sisa: 2, ket: "Sisa" },
    { tanggal: "20/8", masuk: 40, sisa: 16, ket: "Tidak retur" },
    { tanggal: "21/8", masuk: 30, sisa: "-", ket: "-" }

  ];


  /* =========================
     TAMPILKAN IKHWAN
  ========================= */

  const tableIkhwan =
    document.getElementById("tableIkhwan");

  ikhwan.forEach(item => {

    const terjual =
      item.masuk - item.retur;

    tableIkhwan.innerHTML += `
      <tr>
        <td>${item.tanggal}</td>
        <td>${item.masuk}</td>
        <td>${item.retur > 0 ? item.retur : "-"}</td>
        <td>${terjual}</td>
      </tr>
    `;

  });


  /* =========================
     TAMPILKAN AKHWAT
  ========================= */

  const tableAkhwat =
    document.getElementById("tableAkhwat");

  akhwat.forEach(item => {

    tableAkhwat.innerHTML += `
      <tr>
        <td>${item.tanggal}</td>
        <td>${item.masuk}</td>
        <td>${item.sisa}</td>
        <td>${item.ket}</td>
      </tr>
    `;

  });


  /* =========================
     HITUNG TOTAL
  ========================= */

  const totalMasukIkhwan =
    ikhwan.reduce(
      (total, item) => total + item.masuk,
      0
    );

  const totalReturIkhwan =
    ikhwan.reduce(
      (total, item) => total + item.retur,
      0
    );

  const totalMasukAkhwat =
    akhwat.reduce(
      (total, item) => total + item.masuk,
      0
    );

  const totalMasukSemua =
    totalMasukIkhwan +
    totalMasukAkhwat;

  const totalAkhir =
    totalMasukSemua -
    totalReturIkhwan;


  /* =========================
     TAMPILKAN TOTAL
  ========================= */

  document.getElementById("masukIkhwan")
    .textContent = totalMasukIkhwan;

  document.getElementById("masukAkhwat")
    .textContent = totalMasukAkhwat;

  document.getElementById("returIkhwan")
    .textContent = totalReturIkhwan;

  document.getElementById("totalAkhirAtas")
    .textContent = totalAkhir;

  document.getElementById("finalTotal")
    .textContent = totalAkhir;


  /* =========================
     BUAT CANVAS LANDSCAPE
  ========================= */

  async function buatCanvas() {

    const laporan =
      document.getElementById("laporan");

    /*
      Aktifkan mode gambar.
      Ini memaksa:
      IKHWAN KIRI
      AKHWAT KANAN
    */

    laporan.classList.add("capture-mode");

    /*
      Tunggu browser merender ulang
      layout menjadi landscape
    */

    await new Promise(resolve =>
      setTimeout(resolve, 300)
    );

    const canvas =
      await html2canvas(
        laporan,
        {
          scale: 2,
          backgroundColor: "#ffffff",
          useCORS: true,
          width: 1200,
          windowWidth: 1200,
          scrollX: 0,
          scrollY: -window.scrollY
        }
      );

    /*
      Kembalikan tampilan normal
    */

    laporan.classList.remove("capture-mode");

    return canvas;

  }


  /* =========================
     JADIKAN GAMBAR
  ========================= */

  async function jadikanGambar() {

    try {

      const canvas =
        await buatCanvas();

      const link =
        document.createElement("a");

      link.download =
        "Laporan-Donat-10-21-Agustus-2026.png";

      link.href =
        canvas.toDataURL("image/png");

      link.click();

    }

    catch (error) {

      alert(
        "Gagal membuat gambar. Coba lagi."
      );

      console.error(error);

    }

  }


  /* =========================
     KIRIM / BAGIKAN WA
  ========================= */

  async function kirimWhatsApp() {

    try {

      const canvas =
        await buatCanvas();

      const blob =
        await new Promise(resolve =>
          canvas.toBlob(
            resolve,
            "image/png"
          )
        );

      const file =
        new File(
          [blob],
          "Laporan-Donat-10-21-Agustus-2026.png",
          {
            type: "image/png"
          }
        );

      const pesan =
        "🍩 Laporan Donat\n" +
        "Periode 10–21 Agustus 2026\n\n" +
        "Ikhwan masuk: " +
        totalMasukIkhwan +
        "\nAkhwat masuk: " +
        totalMasukAkhwat +
        "\nRetur Ikhwan: " +
        totalReturIkhwan +
        "\nTotal akhir: " +
        totalAkhir +
        " donat";


      /*
        HP modern:
        buka menu bagikan dan sertakan GAMBAR
      */

      if (
        navigator.canShare &&
        navigator.canShare({
          files: [file]
        })
      ) {

        await navigator.share({
          title: "Laporan Donat",
          text: pesan,
          files: [file]
        });

      }

      else {

        /*
          Fallback:
          gambar diunduh,
          lalu WhatsApp dibuka
        */

        const link =
          document.createElement("a");

        link.download =
          "Laporan-Donat-10-21-Agustus-2026.png";

        link.href =
          URL.createObjectURL(blob);

        link.click();


        setTimeout(() => {

          window.open(
            "https://wa.me/?text=" +
            encodeURIComponent(pesan),
            "_blank"
          );

        }, 800);

      }

    }

    catch (error) {

      /*
        User membatalkan share
        bukan dianggap error besar
      */

      if (
        error.name !== "AbortError"
      ) {

        console.error(error);

        alert(
          "Gagal membagikan laporan."
        );

      }

    }

  }

</script>

</body>
</html>
