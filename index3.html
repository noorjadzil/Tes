<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Laporan Donat Agustus 2026</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .header {
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .periode {
      color: #666;
      margin: 0;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      text-align: center;
    }

    .card h3 {
      margin: 0;
      font-size: 14px;
      color: #666;
      font-weight: normal;
    }

    .card .number {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }

    .section {
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .section h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 500px;
    }

    th {
      background: #f1f3f5;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e5e5e5;
      text-align: left;
    }

    td.number {
      text-align: center;
      font-weight: bold;
    }

    .total-row {
      background: #f8f9fa;
      font-weight: bold;
    }

    .footer-total {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .final-total {
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      margin: 10px 0;
    }

    .note {
      color: #666;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🍩 Laporan Donat</h1>
    <p class="periode">9–22 Agustus 2026</p>
  </div>


  <!-- RINGKASAN -->
  <div class="summary">

    <div class="card">
      <h3>Total Masuk Ikhwan</h3>
      <div class="number" id="totalIkhwan">0</div>
    </div>

    <div class="card">
      <h3>Total Masuk Akhwat</h3>
      <div class="number" id="totalAkhwat">0</div>
    </div>

    <div class="card">
      <h3>Total Keseluruhan</h3>
      <div class="number" id="totalSemua">0</div>
    </div>

  </div>


  <!-- IKHWAN -->
  <div class="section">

    <h2>👨 Ikhwan</h2>

    <div class="table-wrapper">

      <table>

        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Masuk</th>
            <th>Sisa / Retur</th>
            <th>Terjual</th>
          </tr>
        </thead>

        <tbody id="tableIkhwan"></tbody>

      </table>

    </div>

  </div>


  <!-- AKHWAT -->
  <div class="section">

    <h2>👩 Akhwat</h2>

    <div class="table-wrapper">

      <table>

        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Masuk</th>
            <th>Sisa</th>
          </tr>
        </thead>

        <tbody id="tableAkhwat"></tbody>

      </table>

    </div>

  </div>


  <!-- TOTAL -->
  <div class="footer-total">

    <h2 style="text-align:center;">Total Keseluruhan</h2>

    <div class="final-total">
      <span id="finalTotal">0</span> Donat
    </div>

    <div class="note">
      <p>
        Total masuk seluruh donat dikurangi retur Ikhwan sebanyak 1 donat.
      </p>
    </div>

  </div>

</div>


<script>

  /*
  ==========================
  DATA IKHWAN
  ==========================
  */

  const ikhwan = [

    { tanggal: "10 Agustus", masuk: 40, retur: 0 },
    { tanggal: "11 Agustus", masuk: 42, retur: 0, habis: true },
    { tanggal: "12 Agustus", masuk: 41, retur: 0 },
    { tanggal: "13 Agustus", masuk: 50, retur: 0 },
    { tanggal: "14 Agustus", masuk: 50, retur: 0 },
    { tanggal: "15 Agustus", masuk: 50, retur: 0 },
    { tanggal: "16 Agustus", masuk: 50, retur: 0 },
    { tanggal: "17 Agustus", masuk: 50, retur: 0 },
    { tanggal: "18 Agustus", masuk: 55, retur: 0 },
    { tanggal: "19 Agustus", masuk: 56, retur: 0 },
    { tanggal: "20 Agustus", masuk: 57, retur: 0, habis: true },
    { tanggal: "21 Agustus", masuk: 50, retur: 1 }

  ];


  /*
  ==========================
  DATA AKHWAT
  ==========================
  */

  const akhwat = [

    { tanggal: "10 Agustus", masuk: 32, sisa: 0 },
    { tanggal: "11 Agustus", masuk: 35, sisa: 0, habis: true },
    { tanggal: "12 Agustus", masuk: 35, sisa: 0 },
    { tanggal: "13 Agustus", masuk: 42, sisa: 1 },
    { tanggal: "14 Agustus", masuk: 40, sisa: 0 },
    { tanggal: "15 Agustus", masuk: 35, sisa: 0 },
    { tanggal: "16 Agustus", masuk: 43, sisa: 1 },
    { tanggal: "17 Agustus", masuk: 37, sisa: 0 },
    { tanggal: "18 Agustus", masuk: 40, sisa: 0 },
    { tanggal: "19 Agustus", masuk: 40, sisa: 2 },
    { tanggal: "20 Agustus", masuk: 40, sisa: 25 },
    { tanggal: "21 Agustus", masuk: 30, sisa: 0 }

  ];


  /*
  ==========================
  TAMPILKAN IKHWAN
  ==========================
  */

  const tableIkhwan =
    document.getElementById("tableIkhwan");

  ikhwan.forEach(data => {

    const terjual =
      data.masuk - data.retur;

    tableIkhwan.innerHTML += `

      <tr>

        <td>${data.tanggal}</td>

        <td class="number">
          ${data.masuk}
        </td>

        <td>
          ${
            data.habis
              ? "Habis"
              : data.retur > 0
                ? data.retur + " Retur"
                : "-"
          }
        </td>

        <td class="number">
          ${
            data.habis
              ? data.masuk
              : data.retur > 0
                ? terjual
                : "-"
          }
        </td>

      </tr>

    `;

  });


  /*
  ==========================
  TAMPILKAN AKHWAT
  ==========================
  */

  const tableAkhwat =
    document.getElementById("tableAkhwat");

  akhwat.forEach(data => {

    tableAkhwat.innerHTML += `

      <tr>

        <td>${data.tanggal}</td>

        <td class="number">
          ${data.masuk}
        </td>

        <td>
          ${
            data.habis
              ? "Habis"
              : data.sisa > 0
                ? data.sisa
                : "-"
          }
        </td>

      </tr>

    `;

  });


  /*
  ==========================
  HITUNG TOTAL
  ==========================
  */

  const totalMasukIkhwan =
    ikhwan.reduce(
      (total, data) =>
        total + data.masuk,
      0
    );

  const totalReturIkhwan =
    ikhwan.reduce(
      (total, data) =>
        total + data.retur,
      0
    );

  const totalIkhwan =
    totalMasukIkhwan -
    totalReturIkhwan;


  const totalAkhwat =
    akhwat.reduce(
      (total, data) =>
        total + data.masuk,
      0
    );


  const totalSemua =
    totalIkhwan +
    totalAkhwat;


  /*
  ==========================
  TAMPILKAN TOTAL
  ==========================
  */

  document.getElementById(
    "totalIkhwan"
  ).textContent =
    totalMasukIkhwan;


  document.getElementById(
    "totalAkhwat"
  ).textContent =
    totalAkhwat;


  document.getElementById(
    "totalSemua"
  ).textContent =
    totalMasukIkhwan +
    totalAkhwat;


  document.getElementById(
    "finalTotal"
  ).textContent =
    totalSemua;


</script>

</body>
</html>
